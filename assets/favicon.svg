<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e7c0"/>
      <stop offset="100%" stop-color="#e6cf8a"/>
    </linearGradient>
  </defs>

  <!-- Light, warm background — high contrast at small sizes. Square (no rounded corners) so we don't lose pixels at 16x16. -->
  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- Original art is 200x80 (aspect 2.5:1). Scale 1.2 -> 240x96. Center: translate(8, 80). -->
  <!-- Stroke widths bumped up + colors darkened for visibility at tiny sizes. -->
  <g transform="translate(8, 80) scale(1.2)" stroke="#2a1f0f" fill="#2a1f0f">
    <!-- Stick figure -->
    <circle cx="30" cy="18" r="6" stroke-width="2.2" fill="none"/>
    <line x1="30" y1="24" x2="30" y2="48" stroke-width="2.2"/>
    <line x1="30" y1="48" x2="22" y2="64" stroke-width="2.2"/>
    <line x1="30" y1="48" x2="38" y2="64" stroke-width="2.2"/>
    <line x1="30" y1="32" x2="20" y2="42" stroke-width="2.2"/>
    <line x1="30" y1="32" x2="44" y2="36" stroke-width="2.2"/>
    <line x1="44" y1="36" x2="52" y2="38" stroke-width="2.0"/>
    <line x1="52" y1="38" x2="55" y2="39" stroke-width="1.4"/>

    <!-- Connecting arc -->
    <path d="M55 39 Q 68 30 80 16" stroke-width="1.6" fill="none" stroke-dasharray="2.4,2.4"/>

    <!-- Neural net edges (uniform weight so they survive 16x16) -->
    <g stroke-width="1.4">
      <line x1="80" y1="16" x2="107" y2="10"/>
      <line x1="80" y1="16" x2="107" y2="30"/>
      <line x1="80" y1="40" x2="107" y2="30"/>
      <line x1="80" y1="40" x2="107" y2="50"/>
      <line x1="80" y1="64" x2="107" y2="50"/>
      <line x1="80" y1="64" x2="107" y2="70"/>
      <line x1="107" y1="10" x2="143" y2="10"/>
      <line x1="107" y1="30" x2="143" y2="30"/>
      <line x1="107" y1="50" x2="143" y2="50"/>
      <line x1="107" y1="70" x2="143" y2="70"/>
      <line x1="143" y1="10" x2="170" y2="28"/>
      <line x1="143" y1="30" x2="170" y2="28"/>
      <line x1="143" y1="50" x2="170" y2="52"/>
      <line x1="143" y1="70" x2="170" y2="52"/>
    </g>

    <!-- Nodes -->
    <circle cx="80" cy="16" r="3.6"/>
    <circle cx="80" cy="40" r="3.6"/>
    <circle cx="80" cy="64" r="3.6"/>
    <circle cx="107" cy="10" r="3.2"/>
    <circle cx="107" cy="30" r="3.2"/>
    <circle cx="107" cy="50" r="3.2"/>
    <circle cx="107" cy="70" r="3.2"/>
    <circle cx="143" cy="10" r="3.2"/>
    <circle cx="143" cy="30" r="3.2"/>
    <circle cx="143" cy="50" r="3.2"/>
    <circle cx="143" cy="70" r="3.2"/>
    <circle cx="170" cy="28" r="3.6"/>
    <circle cx="170" cy="52" r="3.6"/>
  </g>
</svg>
