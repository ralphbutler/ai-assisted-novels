<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1c1a"/>
      <stop offset="50%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#3a2e1a"/>
    </linearGradient>
  </defs>

  <!-- Rounded-corner background tile (Apple-style icon look) -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Original art is 200x80 (aspect 2.5:1). Scale 2.4 -> 480x192. Center in 512x512: translate(16, 160). -->
  <g transform="translate(16, 160) scale(2.4)">
    <!-- Stick figure -->
    <circle cx="30" cy="18" r="6" stroke="#d4a84b" stroke-width="1.4" fill="none"/>
    <line x1="30" y1="24" x2="30" y2="48" stroke="#d4a84b" stroke-width="1.4"/>
    <line x1="30" y1="48" x2="22" y2="64" stroke="#d4a84b" stroke-width="1.4"/>
    <line x1="30" y1="48" x2="38" y2="64" stroke="#d4a84b" stroke-width="1.4"/>
    <line x1="30" y1="32" x2="20" y2="42" stroke="#d4a84b" stroke-width="1.4"/>
    <line x1="30" y1="32" x2="44" y2="36" stroke="#d4a84b" stroke-width="1.4"/>
    <line x1="44" y1="36" x2="52" y2="38" stroke="#e8c472" stroke-width="1.2"/>
    <line x1="52" y1="38" x2="55" y2="39" stroke="#e8c472" stroke-width="0.8"/>

    <!-- Connecting arc -->
    <path d="M55 39 Q 68 30 80 16" stroke="rgba(220,180,100,0.45)" stroke-width="1.0" fill="none" stroke-dasharray="2,2"/>

    <!-- Neural net edges (slightly heavier so they survive downscaling) -->
    <line x1="80" y1="16" x2="107" y2="10" stroke="rgba(220,180,100,0.40)" stroke-width="0.9"/>
    <line x1="80" y1="16" x2="107" y2="30" stroke="rgba(220,180,100,0.40)" stroke-width="0.9"/>
    <line x1="80" y1="16" x2="107" y2="50" stroke="rgba(220,180,100,0.22)" stroke-width="0.9"/>
    <line x1="80" y1="40" x2="107" y2="10" stroke="rgba(220,180,100,0.22)" stroke-width="0.9"/>
    <line x1="80" y1="40" x2="107" y2="30" stroke="rgba(220,180,100,0.48)" stroke-width="0.9"/>
    <line x1="80" y1="40" x2="107" y2="50" stroke="rgba(220,180,100,0.48)" stroke-width="0.9"/>
    <line x1="80" y1="40" x2="107" y2="70" stroke="rgba(220,180,100,0.22)" stroke-width="0.9"/>
    <line x1="80" y1="64" x2="107" y2="50" stroke="rgba(220,180,100,0.40)" stroke-width="0.9"/>
    <line x1="80" y1="64" x2="107" y2="70" stroke="rgba(220,180,100,0.48)" stroke-width="0.9"/>
    <line x1="107" y1="10" x2="143" y2="10" stroke="rgba(220,180,100,0.50)" stroke-width="0.9"/>
    <line x1="107" y1="10" x2="143" y2="30" stroke="rgba(220,180,100,0.28)" stroke-width="0.9"/>
    <line x1="107" y1="30" x2="143" y2="30" stroke="rgba(220,180,100,0.55)" stroke-width="0.9"/>
    <line x1="107" y1="30" x2="143" y2="50" stroke="rgba(220,180,100,0.30)" stroke-width="0.9"/>
    <line x1="107" y1="50" x2="143" y2="30" stroke="rgba(220,180,100,0.30)" stroke-width="0.9"/>
    <line x1="107" y1="50" x2="143" y2="50" stroke="rgba(220,180,100,0.55)" stroke-width="0.9"/>
    <line x1="107" y1="50" x2="143" y2="70" stroke="rgba(220,180,100,0.28)" stroke-width="0.9"/>
    <line x1="107" y1="70" x2="143" y2="50" stroke="rgba(220,180,100,0.28)" stroke-width="0.9"/>
    <line x1="107" y1="70" x2="143" y2="70" stroke="rgba(220,180,100,0.50)" stroke-width="0.9"/>
    <line x1="143" y1="10" x2="170" y2="28" stroke="rgba(220,180,100,0.45)" stroke-width="0.9"/>
    <line x1="143" y1="30" x2="170" y2="28" stroke="rgba(220,180,100,0.55)" stroke-width="0.9"/>
    <line x1="143" y1="30" x2="170" y2="52" stroke="rgba(220,180,100,0.30)" stroke-width="0.9"/>
    <line x1="143" y1="50" x2="170" y2="28" stroke="rgba(220,180,100,0.30)" stroke-width="0.9"/>
    <line x1="143" y1="50" x2="170" y2="52" stroke="rgba(220,180,100,0.55)" stroke-width="0.9"/>
    <line x1="143" y1="70" x2="170" y2="52" stroke="rgba(220,180,100,0.45)" stroke-width="0.9"/>

    <!-- Nodes -->
    <circle cx="80" cy="16" r="3.8" fill="#b8882e"/>
    <circle cx="80" cy="40" r="3.8" fill="#b8882e"/>
    <circle cx="80" cy="64" r="3.8" fill="#b8882e"/>
    <circle cx="107" cy="10" r="3.3" fill="#d4a84b"/>
    <circle cx="107" cy="30" r="3.3" fill="#d4a84b"/>
    <circle cx="107" cy="50" r="3.3" fill="#d4a84b"/>
    <circle cx="107" cy="70" r="3.3" fill="#d4a84b"/>
    <circle cx="143" cy="10" r="3.3" fill="#d4a84b"/>
    <circle cx="143" cy="30" r="3.3" fill="#d4a84b"/>
    <circle cx="143" cy="50" r="3.3" fill="#d4a84b"/>
    <circle cx="143" cy="70" r="3.3" fill="#d4a84b"/>
    <circle cx="170" cy="28" r="3.8" fill="#e8c472"/>
    <circle cx="170" cy="52" r="3.8" fill="#e8c472"/>
