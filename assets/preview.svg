<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1c1a"/>
      <stop offset="40%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#3a2e1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle star field -->
  <g fill="#dcb464" opacity="0.35">
    <circle cx="120" cy="80" r="1.6"/>
    <circle cx="260" cy="150" r="1.2"/>
    <circle cx="980" cy="100" r="1.6"/>
    <circle cx="1080" cy="220" r="1.2"/>
    <circle cx="60" cy="300" r="1.2"/>
    <circle cx="1140" cy="420" r="1.4"/>
    <circle cx="180" cy="500" r="1.2"/>
    <circle cx="900" cy="560" r="1.4"/>
    <circle cx="540" cy="60" r="1.2"/>
    <circle cx="720" cy="50" r="1.4"/>
    <circle cx="40" cy="540" r="1.0"/>
    <circle cx="1160" cy="80" r="1.0"/>
  </g>

  <!-- Figure + neural net, scaled 4x from original 200x80 viewBox, centered horizontally, in upper region -->
  <g transform="translate(200, 60) scale(4)" filter="url(#glow)">
    <!-- Stick figure -->
    <circle cx="30" cy="18" r="6" stroke="#d4a84b" stroke-width="1.2" fill="none"/>
    <line x1="30" y1="24" x2="30" y2="48" stroke="#d4a84b" stroke-width="1.2"/>
    <line x1="30" y1="48" x2="22" y2="64" stroke="#d4a84b" stroke-width="1.2"/>
    <line x1="30" y1="48" x2="38" y2="64" stroke="#d4a84b" stroke-width="1.2"/>
    <line x1="30" y1="32" x2="20" y2="42" stroke="#d4a84b" stroke-width="1.2"/>
    <line x1="30" y1="32" x2="44" y2="36" stroke="#d4a84b" stroke-width="1.2"/>
    <line x1="44" y1="36" x2="52" y2="38" stroke="#e8c472" stroke-width="1.0"/>
    <line x1="52" y1="38" x2="55" y2="39" stroke="#e8c472" stroke-width="0.6"/>

    <!-- Connecting arc -->
    <path d="M55 39 Q 68 30 80 16" stroke="rgba(220,180,100,0.35)" stroke-width="0.8" fill="none" stroke-dasharray="2,2"/>

    <!-- Neural net edges -->
    <line x1="80" y1="16" x2="107" y2="10" stroke="rgba(220,180,100,0.30)" stroke-width="0.7"/>
    <line x1="80" y1="16" x2="107" y2="30" stroke="rgba(220,180,100,0.30)" stroke-width="0.7"/>
    <line x1="80" y1="16" x2="107" y2="50" stroke="rgba(220,180,100,0.18)" stroke-width="0.7"/>
    <line x1="80" y1="16" x2="107" y2="70" stroke="rgba(220,180,100,0.12)" stroke-width="0.7"/>
    <line x1="80" y1="40" x2="107" y2="10" stroke="rgba(220,180,100,0.18)" stroke-width="0.7"/>
    <line x1="80" y1="40" x2="107" y2="30" stroke="rgba(220,180,100,0.34)" stroke-width="0.7"/>
    <line x1="80" y1="40" x2="107" y2="50" stroke="rgba(220,180,100,0.34)" stroke-width="0.7"/>
    <line x1="80" y1="40" x2="107" y2="70" stroke="rgba(220,180,100,0.18)" stroke-width="0.7"/>
    <line x1="80" y1="64" x2="107" y2="10" stroke="rgba(220,180,100,0.12)" stroke-width="0.7"/>
    <line x1="80" y1="64" x2="107" y2="30" stroke="rgba(220,180,100,0.18)" stroke-width="0.7"/>
    <line x1="80" y1="64" x2="107" y2="50" stroke="rgba(220,180,100,0.30)" stroke-width="0.7"/>
    <line x1="80" y1="64" x2="107" y2="70" stroke="rgba(220,180,100,0.34)" stroke-width="0.7"/>
    <line x1="107" y1="10" x2="143" y2="10" stroke="rgba(220,180,100,0.38)" stroke-width="0.7"/>
    <line x1="107" y1="10" x2="143" y2="30" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="107" y1="10" x2="143" y2="50" stroke="rgba(220,180,100,0.12)" stroke-width="0.7"/>
    <line x1="107" y1="10" x2="143" y2="70" stroke="rgba(220,180,100,0.12)" stroke-width="0.7"/>
    <line x1="107" y1="30" x2="143" y2="10" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="107" y1="30" x2="143" y2="30" stroke="rgba(220,180,100,0.40)" stroke-width="0.7"/>
    <line x1="107" y1="30" x2="143" y2="50" stroke="rgba(220,180,100,0.26)" stroke-width="0.7"/>
    <line x1="107" y1="30" x2="143" y2="70" stroke="rgba(220,180,100,0.15)" stroke-width="0.7"/>
    <line x1="107" y1="50" x2="143" y2="10" stroke="rgba(220,180,100,0.12)" stroke-width="0.7"/>
    <line x1="107" y1="50" x2="143" y2="30" stroke="rgba(220,180,100,0.26)" stroke-width="0.7"/>
    <line x1="107" y1="50" x2="143" y2="50" stroke="rgba(220,180,100,0.40)" stroke-width="0.7"/>
    <line x1="107" y1="50" x2="143" y2="70" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="107" y1="70" x2="143" y2="10" stroke="rgba(220,180,100,0.10)" stroke-width="0.7"/>
    <line x1="107" y1="70" x2="143" y2="30" stroke="rgba(220,180,100,0.15)" stroke-width="0.7"/>
    <line x1="107" y1="70" x2="143" y2="50" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="107" y1="70" x2="143" y2="70" stroke="rgba(220,180,100,0.38)" stroke-width="0.7"/>
    <line x1="143" y1="10" x2="170" y2="28" stroke="rgba(220,180,100,0.30)" stroke-width="0.7"/>
    <line x1="143" y1="10" x2="170" y2="52" stroke="rgba(220,180,100,0.15)" stroke-width="0.7"/>
    <line x1="143" y1="30" x2="170" y2="28" stroke="rgba(220,180,100,0.38)" stroke-width="0.7"/>
    <line x1="143" y1="30" x2="170" y2="52" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="143" y1="50" x2="170" y2="28" stroke="rgba(220,180,100,0.22)" stroke-width="0.7"/>
    <line x1="143" y1="50" x2="170" y2="52" stroke="rgba(220,180,100,0.38)" stroke-width="0.7"/>
    <line x1="143" y1="70" x2="170" y2="28" stroke="rgba(220,180,100,0.15)" stroke-width="0.7"/>
    <line x1="143" y1="70" x2="170" y2="52" stroke="rgba(220,180,100,0.30)" stroke-width="0.7"/>

    <!-- Neural net nodes -->
    <circle cx="80" cy="16" r="3.5" fill="#b8882e"/>
    <circle cx="80" cy="40" r="3.5" fill="#b8882e"/>
    <circle cx="80" cy="64" r="3.5" fill="#b8882e"/>
    <circle cx="107" cy="10" r="3" fill="#d4a84b"/>
    <circle cx="107" cy="30" r="3" fill="#d4a84b"/>
    <circle cx="107" cy="50" r="3" fill="#d4a84b"/>
    <circle cx="107" cy="70" r="3" fill="#d4a84b"/>
    <circle cx="143" cy="10" r="3" fill="#d4a84b"/>
    <circle cx="143" cy="30" r="3" fill="#d4a84b"/>
    <circle cx="143" cy="50" r="3" fill="#d4a84b"/>
    <circle cx="143" cy="70" r="3" fill="#d4a84b"/>
    <circle cx="170" cy="28" r="3.5" fill="#e8c472"/>
    <circle cx="170" cy="52" r="3.5" fill="#e8c472"/>
  </g>

  <!-- Title -->
  <text x="600" y="490" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="78" fill="#ffffff"
        letter-spacing="3">AI-Assisted Novels</text>

  <!-- Author -->
  <text x="600" y="560" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-style="italic"
        fill="#dcc8a0">Ralph M. Butler</text>
</svg>
